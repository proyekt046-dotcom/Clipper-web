<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Clipper Pro - Vizard Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #0f111a; color: #ffffff; max-width: 550px; margin: 0 auto; padding: 20px 15px; }
        .card { background: #161925; border-radius: 16px; padding: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); border: 1px solid #23283b; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 26px; margin: 0; color: #ff3b69; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .header p { color: #8b949e; font-size: 14px; margin: 8px 0 0 0; }
        .badge { background: rgba(255, 59, 105, 0.15); color: #ff3b69; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid rgba(255, 59, 105, 0.3); display: inline-block; margin-top: 10px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #c9d1d9; }
        input[type="text"], select { width: 100%; padding: 12px 16px; background: #0f111a; border: 1px solid #2d334a; border-radius: 8px; color: white; font-size: 14px; box-sizing: border-box; }
        .mode-container { display: flex; gap: 10px; }
        .mode-option { flex: 1; text-align: center; padding: 12px; background: #0f111a; border: 1px solid #2d334a; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: 0.2s; }
        .mode-option.active { background: #ff3b69; border-color: #ff3b69; color: white; }
        .btn-submit { background: #ff3b69; color: white; border: none; width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 15px rgba(255, 59, 105, 0.4); }
        #loading { display: none; text-align: center; margin: 20px 0; color: #ff9f43; font-weight: 600; }
        .klip-box { background: #0f111a; padding: 15px; border-radius: 12px; border: 1px solid #2d334a; margin-top: 20px; text-align: left; }
        .score-badge { background: #28a745; color: white; padding: 3px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1><span>🎬</span> clipper pro</h1>
        <p>Dashboard Otomatis Pemotong Video Massal & Auto Caption AI.</p>
        <div class="badge">🔥 Mode Multi-Clip & Subtitle Aktif</div>
    </div>

    <div class="form-group">
        <label>Link YouTube</label>
        <input type="text" id="url-video" placeholder="Masukkan link video YouTube">
    </div>
<!-- Mulai baris 39, sisipkan kode di bawah ini -->
<div class="form-group" style="margin-top: 15px;">
    <label><i class="fa-solid fa-bullseye"></i> Target / Tema Campaign</label>
    <input type="text" id="campaign-target" placeholder="Contoh: Affiliate Gamis Lebaran / Skincare Glowing">
</div>

    <div class="form-group">
        <label>Metode Pemotongan Video</label>
        <div class="mode-container">
            <div class="mode-option active" id="cut-manual" onclick="setCutMode('manual')">Manual Cut</div>
            <div class="mode-option" id="cut-auto" onclick="setCutMode('auto')">🤖 AI Multi-Cut (3 Klip)</div>
        </div>
    </div>

    <div id="opsi-manual-container">
        <div class="form-group">
            <label>Rentang Waktu (Menit:Detik)</label>
            <div style="display:flex; gap:10px;">
                <input type="text" id="time-start" value="02:00" style="width:50%; text-align:center;">
                <input type="text" id="time-end" value="02:55" style="width:50%; text-align:center;">
            </div>
        </div>
        <div class="form-group">
            <label>Teks Visual Hook Manual</label>
            <input type="text" id="teks-hook" placeholder="Contoh: Momen Paling Menarik! 😱">
        </div>
    </div>

    <div class="form-group">
        <label>Warna Teks Auto-Caption</label>
        <select id="warna-sub">
            <option value="yellow">💛 Kuning Vizard Style</option>
            <option value="green">💚 Hijau TikTok Style</option>
            <option value="white">🤍 Putih Polos Baku</option>
        </select>
    </div>

    <div class="form-group">
        <label>Gaya Tampilan Video</label>
        <div class="mode-container">
            <div class="mode-option active" id="mode-crop" onclick="setDisplayMode('crop')">Crop Tengah</div>
            <div class="mode-option" id="mode-blur" onclick="setDisplayMode('blur')">Blur Latar</div>
        </div>
    </div>

    <button class="btn-submit" onclick="eksekusiBuatVideoMassal()">Buat Video Massal Otomatis</button>

    <div id="loading">⏳ <span id="loading-text">AI sedang mengekstrak, menganalisis, dan memotong 3 klip video terbaik sekaligus...</span></div>

    <div id="daftar-hasil" style="margin-top:25px; display:none;">
        <h3 style="color: #28a745; text-align:center;">🎉 Hasil Pemotongan AI Berhasil!</h3>
        <div id="konten-klip"></div>
    </div>
</div>

<script>
    let cutMode = 'manual';
    let displayMode = 'crop';

    function setCutMode(mode) {
        cutMode = mode;
        document.getElementById('cut-manual').classList.remove('active');
        document.getElementById('cut-auto').classList.remove('active');
        if(mode === 'manual') {
            document.getElementById('cut-manual').classList.add('active');
            document.getElementById('opsi-manual-container').style.display = 'block';
        } else {
            document.getElementById('cut-auto').classList.add('active');
            document.getElementById('opsi-manual-container').style.display = 'none';
        }
    }

    function setDisplayMode(mode) {
        displayMode = mode;
        document.getElementById('mode-crop').classList.remove('active');
        document.getElementById('mode-blur').classList.remove('active');
        if(mode === 'crop') document.getElementById('mode-crop').classList.add('active');
        else document.getElementById('mode-blur').classList.add('active');
    }

    function eksekusiBuatVideoMassal() {
        const url = document.getElementById('url-video').value;
        if(!url) { alert("Harap masukkan Link YouTube!"); return; }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('daftar-hasil').style.display = 'none';
        document.getElementById('konten-klip').innerHTML = '';

        fetch('/proses', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                url: url,
                mode_cut: cutMode,
                mulai: document.getElementById('time-start').value,
                selesai: document.getElementById('time-end').value,
                teks_hook: document.getElementById('teks-hook').value,
                mode: displayMode,
                warna_sub: document.getElementById('warna-sub').value
            })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('loading').style.display = 'none';
            if(data.status === "Sukses") {
                document.getElementById('daftar-hasil').style.display = 'block';
                data.klips.forEach((klip, i) => {
                    document.getElementById('konten-klip').innerHTML += `
                        <div class="klip-box">
                            <h4 style="margin:0 0 8px 0; color:#ff3b69;">🎬 Klip #${i+1} (${klip.mulai} - ${klip.selesai})</h4>
                            <p style="margin:5px 0;"><span class="score-badge">📈 Skor Viral: ${klip.skor}%</span></p>
                            <p style="font-size:13px; color:#c9d1d9; margin:5px 0;"><b>Hook:</b> "${klip.teks_hook}"</p>
                            <p style="font-size:12px; color:#8b949e; margin:5px 0 12px 0;"><b>Analisis AI:</b> ${klip.alasan}</p>
                            <video width="100%" style="border-radius:8px; margin-bottom:10px;" controls src="${klip.video_url}"></video>
                            <a href="${klip.video_url}" download><button class="btn-submit" style="background:#28a745; margin:0; padding:10px;">Download Klip #${i+1}</button></a>
                        </div>
                    `;
                });
            } else {
                alert("Error: " + data.error);
            }
        })
        .catch(err => {
            document.getElementById('loading').style.display = 'none';
            alert("Gagal terhubung ke Termux.");
        });
    }
</script>

</body>
</html>
